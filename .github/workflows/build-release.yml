name: Build and Release Windows EXE

on:
  workflow_dispatch: # Запуск вручную по кнопке
  push:
    tags:
      - 'v*' # Автозапуск, когда вы создаете тег версии (например, v1.0.0)

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Скачивание кода
      uses: actions/checkout@v4

    - name: Установка Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Установка зависимостей и сборка EXE
      working-directory: ./Electron_EXE_Project
      run: |
        npm install
        npm run build

    - name: Сохранить в Artifacts (для проверки)
      uses: actions/upload-artifact@v4
      with:
        name: Dota2-Drafter-Win
        path: |
          Electron_EXE_Project/dist/*.exe
          Electron_EXE_Project/out/**/*.exe

    - name: Создать Release на главной странице
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          Electron_EXE_Project/dist/*.exe
          Electron_EXE_Project/out/**/*.exe

